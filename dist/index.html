  <style>
/* ─── LifeAdapt – Design System ───────────────────────────────────────────── */

:root {
  --bg-base:        #0a0d12;
  --bg-surface:     #111722;
  --bg-raised:      #1a2235;
  --bg-hover:       #1e2840;
  --border:         rgba(255,255,255,0.08);
  --border-strong:  rgba(255,255,255,0.15);

  --text-primary:   #f0f4ff;
  --text-secondary: #8a9bb8;
  --text-muted:     #5a6780;

  --accent-lime:    #a3e635;
  --accent-lime-dim:#6fa01a;
  --accent-cyan:    #22d3ee;
  --accent-cyan-dim:#0e7490;
  --accent-amber:   #fbbf24;
  --accent-red:     #ef4444;
  --accent-green:   #4ade80;

  --ev-fixed:       #1e4d8c;
  --ev-sleep:       #0c3a5a;
  --ev-wind-down:   #1a2d4a;
  --ev-routine:     #1a3a2a;
  --ev-travel:      #2d2a18;
  --ev-prep:        #2a1e50;
  --ev-optional:    #1e2835;
  --ev-required:    #0e2d3a;
  --ev-conflict:    #3a1e1e;

  --radius:         8px;
  --radius-lg:      12px;
  --radius-xl:      16px;

  --sidebar-w:      220px;
  --panel-w:        260px;
  --font:           'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono:      'Cascadia Code', 'Fira Code', monospace;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* ─── Reset ───────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#loading { display: none; }

/* ─── Layout ──────────────────────────────────────────────────────────────────── */
#app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--panel-w);
  grid-template-areas: "sidebar main panel";
  height: 100vh;
  overflow: hidden;
}

#sidebar {
  grid-area: sidebar;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}

#main-content {
  grid-area: main;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
}

#right-panel {
  grid-area: panel;
  background: var(--bg-surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

/* ─── Sidebar ─────────────────────────────────────────────────────────────────── */
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
}

.brand-logo { color: var(--accent-lime); flex-shrink: 0; }

.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.brand-tag {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.sidebar-nav {
  flex: 1;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  text-align: left;
  position: relative;
}

.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: rgba(163,230,53,0.12); color: var(--accent-lime); }
.nav-item:focus-visible { outline: 2px solid var(--accent-lime); outline-offset: 2px; }

.nav-badge {
  margin-left: auto;
  font-size: 12px;
}

.badge-ok { color: var(--accent-green); }
.badge-warn { color: var(--accent-amber); }

/* ─── Scenario selector ───────────────────────────────────────────────────────── */
.sidebar-scenarios {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.sidebar-section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}

.scenario-buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.scenario-btn {
  flex: 1;
  padding: 7px 4px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg-raised);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.scenario-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.scenario-btn.active { background: rgba(163,230,53,0.12); border-color: var(--accent-lime); color: var(--accent-lime); }
.scenario-btn:focus-visible { outline: 2px solid var(--accent-lime); }

.scenario-label {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.3;
}

/* ─── Sidebar footer ──────────────────────────────────────────────────────────── */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.approved-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--accent-green);
  flex-wrap: wrap;
}

.btn-undo {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
}

.btn-undo:hover { color: var(--text-primary); background: var(--bg-hover); }

.btn-reset {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-reset:hover { color: var(--accent-red); border-color: var(--accent-red); }

.sidebar-disclaimer {
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
  text-align: center;
}

/* ─── View container ──────────────────────────────────────────────────────────── */
.view-container {
  padding: 24px 28px;
  max-width: 900px;
}

.view-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 16px;
  flex-wrap: wrap;
}

.view-header-left { flex: 1; }

.view-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.view-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.view-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ─── Buttons ─────────────────────────────────────────────────────────────────── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent-lime);
  color: #0a0d12;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}

.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:focus-visible { outline: 2px solid var(--accent-lime); outline-offset: 3px; }

.btn-primary.btn-large { padding: 11px 22px; font-size: 14px; }

.btn-primary.btn-disabled,
.btn-primary:disabled {
  background: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.6;
  transform: none;
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg-raised);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-secondary:focus-visible { outline: 2px solid var(--accent-lime); outline-offset: 2px; }

.btn-secondary.btn-danger:hover { color: var(--accent-red); border-color: var(--accent-red); }

.btn-reject-change {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 4px;
  background: transparent;
  color: var(--accent-red);
  font-size: 11px;
  cursor: pointer;
  margin-left: auto;
}

.btn-reject-change:hover { background: rgba(239,68,68,0.1); }
.btn-small { padding: 5px 10px; font-size: 12px; }

/* ─── Demo badge ──────────────────────────────────────────────────────────────── */
.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid rgba(251,191,36,0.3);
  border-radius: 20px;
  background: rgba(251,191,36,0.08);
  color: var(--accent-amber);
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}

/* ─── Today grid ──────────────────────────────────────────────────────────────── */
.today-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.wearable-card, .upcoming-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}

.wearable-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--accent-amber);
  background: rgba(251,191,36,0.08);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: 4px;
  padding: 3px 8px;
  margin-bottom: 12px;
  width: fit-content;
}

.wearable-metrics { display: flex; gap: 16px; margin-bottom: 12px; }

.metric {
  flex: 1;
  background: var(--bg-surface);
  border-radius: var(--radius);
  padding: 10px 12px;
}

.metric-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.metric-value {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 6px;
}

.metric-bar {
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}

.metric-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}

.wearable-disclaimer {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.upcoming-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.upcoming-item:last-child { border-bottom: none; }

.upcoming-icon { color: var(--accent-cyan); }
.upcoming-time { color: var(--text-secondary); min-width: 40px; font-variant-numeric: tabular-nums; }
.upcoming-title { color: var(--text-primary); }

/* ─── Day Calendar ────────────────────────────────────────────────────────────── */
.day-calendar-wrapper {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 20px;
}

.day-calendar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
}

.day-calendar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.day-calendar {
  position: relative;
  overflow-x: auto;
}

.hour-labels {
  position: absolute;
  left: 0;
  top: 0;
  width: 56px;
  pointer-events: none;
}

.hour-label {
  position: absolute;
  left: 0;
  width: 56px;
  display: flex;
  align-items: flex-start;
  gap: 0;
}

.hour-label span {
  font-size: 10px;
  color: var(--text-muted);
  padding: 0 6px;
  line-height: 1;
  white-space: nowrap;
  margin-top: -5px;
  font-variant-numeric: tabular-nums;
}

.hour-line {
  position: absolute;
  right: 0;
  top: 0;
  left: 0;
  height: 1px;
  background: var(--border);
}

.events-area {
  margin-left: 60px;
  position: relative;
  margin-right: 8px;
}

/* ─── Event blocks ────────────────────────────────────────────────────────────── */
.event-block {
  position: absolute;
  left: 2px;
  right: 2px;
  border-radius: 6px;
  padding: 4px 7px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: filter 0.1s, transform 0.1s;
  overflow: hidden;
  min-height: 24px;
}

.event-block:hover { filter: brightness(1.15); transform: translateX(1px); }
.event-block:focus-visible { outline: 2px solid var(--accent-lime); outline-offset: 2px; }

.event-block.ev-fixed    { background: var(--ev-fixed); border-color: rgba(34,211,238,0.2); }
.event-block.ev-sleep    { background: var(--ev-sleep); border-color: rgba(34,211,238,0.3); border-style: dashed; }
.event-block.ev-wind-down { background: var(--ev-wind-down); border-color: rgba(34,211,238,0.15); }
.event-block.ev-routine  { background: var(--ev-routine); border-color: rgba(74,222,128,0.2); }
.event-block.ev-travel   { background: var(--ev-travel); border-color: rgba(251,191,36,0.2); }
.event-block.ev-required { background: var(--ev-required); border-color: rgba(34,211,238,0.25); }
.event-block.ev-important { background: #1e3040; border-color: rgba(34,211,238,0.15); }
.event-block.ev-optional { background: var(--ev-optional); border-color: rgba(255,255,255,0.08); }
.event-block.ev-conflict { background: var(--ev-conflict); border-color: rgba(239,68,68,0.4); }

.event-block.completed { opacity: 0.45; }
.event-block.proposed  { border-color: var(--accent-lime); box-shadow: 0 0 0 1px rgba(163,230,53,0.2); }
.event-block.conflict  { border-color: var(--accent-red); }

.event-block-inner { height: 100%; display: flex; flex-direction: column; justify-content: center; }

.event-header {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.event-icon { color: var(--text-muted); flex-shrink: 0; }
.event-time {
  font-size: 10px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.event-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.event-title-inline {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline;
  margin-left: 4px;
}

.proposed-badge, .conflict-badge, .cross-midnight-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
  white-space: nowrap;
}

.proposed-badge { background: rgba(163,230,53,0.2); color: var(--accent-lime); }
.conflict-badge { display: flex; align-items: center; gap: 2px; background: rgba(239,68,68,0.2); color: var(--accent-red); }
.cross-midnight-badge { color: var(--accent-cyan); font-size: 9px; margin-top: 2px; }

/* ─── Approved indicator ──────────────────────────────────────────────────────── */
.approved-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-green);
  font-size: 12px;
  font-weight: 600;
}

/* ─── Protect form ────────────────────────────────────────────────────────────── */
.protect-grid { max-width: 660px; }

.protect-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-section {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
}

fieldset { border: none; }

legend {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-cyan);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 14px;
  padding: 0;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
}

.form-field:last-child { margin-bottom: 0; }

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.field-hint {
  font-size: 11px;
  color: var(--text-muted);
}

.input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  transition: border-color 0.15s;
  color-scheme: dark;
}

.input:hover { border-color: rgba(255,255,255,0.2); }
.input:focus { outline: none; border-color: var(--accent-lime); }

/* ─── Radio group ─────────────────────────────────────────────────────────────── */
.radio-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.radio-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg-surface);
}

.radio-option:hover { border-color: rgba(255,255,255,0.2); }
.radio-option.selected { border-color: var(--accent-lime); background: rgba(163,230,53,0.06); }

.radio-option input[type="radio"] { margin-top: 3px; flex-shrink: 0; accent-color: var(--accent-lime); }

.radio-content { display: flex; flex-direction: column; gap: 3px; }
.radio-content strong { font-size: 13px; color: var(--text-primary); }
.radio-content span { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

/* ─── Sleep preview ───────────────────────────────────────────────────────────── */
.sleep-preview {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
}

.sleep-preview h4 {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-bottom: 14px;
}

.preview-table { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

.preview-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.preview-label { color: var(--text-secondary); }
.preview-value { color: var(--text-primary); }

.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding-top: 4px;
}

/* ─── Info/conflict boxes ─────────────────────────────────────────────────────── */
.info-box {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(34,211,238,0.08);
  border: 1px solid rgba(34,211,238,0.2);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 14px;
  line-height: 1.5;
}

.conflict-notice {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: var(--radius);
  font-size: 12px;
  color: #fca5a5;
  line-height: 1.5;
}

.ok-notice {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--accent-green);
}

/* ─── Review view ─────────────────────────────────────────────────────────────── */
.alert-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.5;
}

.alert-error {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
}

.alert-success {
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.2);
  color: var(--accent-green);
}

.plan-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.summary-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
}

.summary-rescheduled { background: rgba(34,211,238,0.12); color: var(--accent-cyan); border-color: rgba(34,211,238,0.3); }
.summary-deferred    { background: rgba(251,191,36,0.12); color: var(--accent-amber); border-color: rgba(251,191,36,0.3); }
.summary-rejected    { background: rgba(239,68,68,0.12); color: var(--accent-red); border-color: rgba(239,68,68,0.3); }

.summary-text {
  font-size: 12px;
  color: var(--text-secondary);
}

.prep-status-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 16px;
}

.prep-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.badge-ok {
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(74,222,128,0.15);
  color: var(--accent-green);
  font-size: 11px;
  font-weight: 700;
}

.badge-warn {
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(251,191,36,0.15);
  color: var(--accent-amber);
  font-size: 11px;
  font-weight: 700;
}

.prep-bar {
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
}

.prep-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}

.fill-ok { background: var(--accent-green); }
.fill-warn { background: var(--accent-amber); }

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 20px 0 12px;
}

.conflict-section, .deferred-section {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
}

.conflict-list, .deferred-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.conflict-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: #fca5a5;
  padding: 8px 10px;
  background: rgba(239,68,68,0.06);
  border-radius: var(--radius);
}

.conflict-icon { color: var(--accent-red); flex-shrink: 0; margin-top: 1px; }

.deferred-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 10px;
  background: rgba(251,191,36,0.06);
  border-radius: var(--radius);
  font-size: 12px;
}

.conflict-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

.acknowledge-check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px;
  margin-top: 10px;
  background: rgba(251,191,36,0.06);
  border: 1px solid rgba(251,191,36,0.15);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  color: var(--accent-amber);
  line-height: 1.4;
}

.acknowledge-check input { accent-color: var(--accent-amber); margin-top: 2px; flex-shrink: 0; }

.ok-text {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--accent-green);
  margin-top: 8px;
}

/* ─── Changes list ────────────────────────────────────────────────────────────── */
.changes-section {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
}

.changes-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.change-item {
  padding: 12px 14px;
  background: var(--bg-surface);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent-cyan);
}

.change-item.rejected {
  opacity: 0.5;
  border-left-color: var(--accent-red);
  text-decoration: line-through;
}

.change-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.change-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.change-moved     { background: rgba(34,211,238,0.15); color: var(--accent-cyan); }
.change-shortened { background: rgba(251,191,36,0.15); color: var(--accent-amber); }
.change-deferred  { background: rgba(239,68,68,0.15); color: var(--accent-red); }
.change-split     { background: rgba(163,230,53,0.15); color: var(--accent-lime); }
.change-added     { background: rgba(74,222,128,0.15); color: var(--accent-green); }

.rejected-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(239,68,68,0.15);
  color: var(--accent-red);
}

.change-times {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}

.old-time { color: var(--text-muted); text-decoration: line-through; }
.arrow { color: var(--text-muted); }
.new-time { color: var(--text-primary); font-weight: 600; }

.change-reason {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin: 0;
}

/* ─── Calendar compare ────────────────────────────────────────────────────────── */
.calendars-section { margin: 16px 0; }

.calendar-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.calendar-col { min-width: 0; }
.calendar-single { max-width: 500px; }

/* ─── Explanation ─────────────────────────────────────────────────────────────── */
.explanation-details {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
}

.explanation-details summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  list-style: none;
  user-select: none;
}

.explanation-details summary:hover { color: var(--text-primary); }

.explanation-text {
  padding: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  white-space: pre-wrap;
  line-height: 1.7;
  border-top: 1px solid var(--border);
}

/* ─── Approval section ────────────────────────────────────────────────────────── */
.approval-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

.approval-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--accent-amber);
  padding-bottom: 16px;
}

.approval-success {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: var(--radius);
  color: var(--accent-green);
  font-size: 14px;
  font-weight: 600;
  width: 100%;
}

/* ─── Right panel ─────────────────────────────────────────────────────────────── */
.panel-section {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.panel-section:last-child { border-bottom: none; margin-bottom: 0; }

.panel-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.simulated-badge {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-amber);
  background: rgba(251,191,36,0.1);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: 3px;
  padding: 1px 6px;
  margin-bottom: 10px;
  width: fit-content;
}

.panel-metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}

.panel-metric:last-child { border-bottom: none; }
.panel-metric span { color: var(--text-secondary); }
.panel-metric strong { color: var(--text-primary); }

.panel-note {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-top: 8px;
}

.panel-event-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.text-ok { color: var(--accent-green); }
.text-warn { color: var(--accent-amber); }

/* ─── Modal ───────────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.15s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.2s ease;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-header h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
}

.modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.modal-close:focus-visible { outline: 2px solid var(--accent-lime); }

.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}

/* ─── Event detail ────────────────────────────────────────────────────────────── */
.event-detail-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.detail-row:last-child { border-bottom: none; }
.detail-row span { color: var(--text-secondary); }
.detail-row strong { color: var(--text-primary); }
.detail-row.text-warn strong { color: var(--accent-amber); }

.flex-event-actions { margin-top: 12px; }

/* ─── Empty state ─────────────────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  gap: 12px;
  color: var(--text-secondary);
}

.empty-icon { color: var(--text-muted); opacity: 0.4; }

.empty-state h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.empty-state p {
  font-size: 14px;
  max-width: 300px;
}

/* ─── Misc utilities ──────────────────────────────────────────────────────────── */
.muted-text { color: var(--text-muted); }
.form-error {
  padding: 8px 12px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: var(--radius);
  color: #fca5a5;
  font-size: 12px;
}

/* ─── Print styles ────────────────────────────────────────────────────────────── */
@media print {
  #sidebar, #right-panel, .btn-primary, .btn-secondary, .btn-reject-change,
  .modal-overlay, .view-header-actions { display: none !important; }

  #app-shell {
    grid-template-columns: 1fr;
    grid-template-areas: "main";
  }

  body { background: white; color: #000; }
  .view-container { padding: 10px; max-width: 100%; }
  .day-calendar-wrapper { border: 1px solid #ccc; }
  .event-block { border: 1px solid #ccc !important; background: #eee !important; }
  .event-title, .event-time { color: #000 !important; }
  .changes-section, .conflict-section { background: #f9f9f9; border: 1px solid #ccc; }
  .alert-banner { border: 1px solid #ccc; }
}

/* ─── Mobile ──────────────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  #app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "sidebar" "main" "panel";
  }

  #sidebar {
    flex-direction: row;
    flex-wrap: wrap;
    overflow-x: auto;
    padding: 8px;
    border-right: none;
    border-bottom: 1px solid var(--border);
    height: auto;
  }

  .sidebar-brand { padding: 8px 12px; border-bottom: none; }
  .brand-tag { display: none; }

  .sidebar-nav {
    flex-direction: row;
    padding: 4px;
    gap: 4px;
  }

  .sidebar-scenarios { display: none; }
  .sidebar-footer { flex-direction: row; flex-wrap: wrap; padding: 8px; border-top: 1px solid var(--border); }

  #right-panel { display: none; }

  .today-grid {
    grid-template-columns: 1fr;
  }

  .calendar-compare {
    grid-template-columns: 1fr;
  }

  .view-container { padding: 16px; }
  .view-header { flex-direction: column; }

  .approval-actions {
    flex-direction: column;
    align-items: stretch;
  }
}

    if (wakeTime < ev.earliestWakeTime) {
        conflicts.push(`You’d need to wake at ${fmtT(wakeTime)}, earlier than the ${fmtT(ev.earliestWakeTime)} you chose.`);
        wakeTime = ev.earliestWakeTime;
    }
    if (wakeTime > ev.latestWakeTime) {
        conflicts.push(`You’d need to wake at ${fmtT(wakeTime)}, later than the ${fmtT(ev.latestWakeTime)} you chose.`);
        wakeTime = ev.latestWakeTime;
    }

function suggestMicroBreaks(events,clock,personaId){

 const gaps=[];let cursor=Math.max(clock,today(9,0));
 for(const event of [...busy,{start:end,end:end}]){if(event.start-cursor>=45*60000)gaps.push({start:cursor,end:event.start});cursor=Math.max(cursor,event.end);}

 return {...flexibleActivity('micro_'+personaId+'_'+i,labels[((personaId.charCodeAt(0)-65)+DEMO_DAY+i)%labels.length],start,start+minutes*60000,today(0,0),tomorrow(0,0),minutes,minutes,'micro-break'),isMicroBreak:true};

        // must be re-confirmed against the new proposal.

    // their original placement and revalidates the entire plan, surfacing any
    // resulting overlap as an unresolved conflict (which blocks approval).

    // changes were rejected (there won't be a fresh change record for a pinned
    // task, so synthesize one if needed).
    const changes = newProposal.changes.map(c => rejectedChangeIds.includes(c.eventId) ? { ...c, rejected: true } : c);

                eventId: id,

                originalStart: prior?.originalStart,
                originalEnd: prior?.originalEnd,

// ── components/calendar.js ──
// ─── Day Calendar Component ───────────────────────────────────────────────────
const HOUR_HEIGHT = 60; // px per hour
const DAY_START_HOUR = 6;
const DAY_END_HOUR = 26; // supports 2am next day
function legacyDayCalendar(events, dayMs, options) {
    const totalHours = DAY_END_HOUR - DAY_START_HOUR;
    const totalHeight = totalHours * HOUR_HEIGHT;
    const dayStart = startOfDay(dayMs) + DAY_START_HOUR * 3600000;
    // Filter events that fall on this day or overlap from previous
    const dayEvents = events.filter(ev => {
        const evStartDay = startOfDay(ev.start);
        const evEndDay = startOfDay(ev.end - 1);
        const thisDay = startOfDay(dayMs);
        return evStartDay === thisDay || evEndDay === thisDay ||
            (ev.start < thisDay + 24 * 3600000 && ev.end > thisDay);
    });
    // Sort by start time
    const sorted = [...dayEvents].sort((a, b) => a.start - b.start);
    // Calculate positions
    const positioned = sorted.map(ev => {
        const clampedStart = Math.max(ev.start, dayStart);
        const clampedEnd = Math.min(ev.end, dayStart + totalHours * 3600000);
        const startOffset = (clampedStart - dayStart) / 3600000;
        const duration = Math.max((clampedEnd - clampedStart) / 3600000, 0.25);
        return {
            ev,
            top: startOffset * HOUR_HEIGHT,
            height: Math.max(duration * HOUR_HEIGHT, 28),
        };
    });
    // Build hour labels
    const hourLabels = [];
    for (let h = DAY_START_HOUR; h <= DAY_END_HOUR; h++) {
        const displayH = h % 24;
        const label = displayH === 0 ? 'Midnight' : `${String(displayH).padStart(2, '0')}:00`;
        const top = (h - DAY_START_HOUR) * HOUR_HEIGHT;
        hourLabels.push(`
      <div class="hour-label" style="top:${top}px" aria-hidden="true">
        <span>${label}</span>
        <div class="hour-line"></div>
      </div>
    `);
    }
    // Build event blocks
    const eventBlocks = positioned.map(({ ev, top, height }) => {
        const colorClass = getEventColorClass(ev);
        const isCrossMidnight = !sameDay(ev.start, ev.end - 1);
        const hasProposed = ev.isProposed;
        const isCompleted = eventPhase(ev, getState().demoClockMs) === 'Completed';
        const isConflict = !!ev.deferredReason;
        const icon = ev.kind === 'fixed'
            ? Icons.lock(12)
            : ev.kind === 'sleep'
                ? Icons.moon(12)
                : ev.kind === 'wind_down'
                    ? Icons.moon(12)
                    : ev.kind === 'routine'
                        ? Icons.sun(12)
                        : ev.kind === 'travel'
                            ? Icons.clock(12)
                            : Icons.sliders(12);
        const crossMidnightBadge = isCrossMidnight
            ? `<span class="cross-midnight-badge">→ ${fmtTime(ev.end)}</span>`
            : '';
        const proposedBadge = hasProposed
            ? `<span class="proposed-badge">Proposed</span>`
            : '';
        const conflictBadge = isConflict
            ? `<span class="conflict-badge">${Icons.alert(10)} Conflict</span>`
            : '';
        return `
      <div
        class="event-block ${colorClass} ${isCompleted ? 'completed' : ''} ${hasProposed ? 'proposed' : ''} ${isConflict ? 'conflict' : ''}"
        style="top:${top}px; height:${height}px"
        data-event-id="${ev.id}"
        role="button"
        tabindex="0"
        aria-label="${ev.title}, ${fmtTime(ev.start)} to ${fmtTime(ev.end)}"
      >
        <div class="event-block-inner">
          <div class="event-header">
            <span class="event-icon">${icon}</span>
            <span class="event-time">${fmtTime(ev.start)}${height > 40 ? '–' + fmtTime(ev.end) : ''}</span>
            ${proposedBadge}${conflictBadge}
          </div>
          ${height > 32 ? `<div class="event-title">${escHtml(ev.title)}</div>` : `<div class="event-title-inline">${escHtml(ev.title)}</div>`}
          ${crossMidnightBadge}
        </div>
      </div>
    `;
    });
    return `
    <div class="day-calendar-wrapper">
      <div class="day-calendar-header">
        <h3 class="day-calendar-title">${escHtml(options.title)}</h3>
      </div>
      <div class="day-calendar" style="height:${totalHeight}px" role="grid" aria-label="${options.title} calendar">
        <div class="hour-labels" aria-hidden="true">${hourLabels.join('')}</div>
        <div class="events-area">${eventBlocks.join('')}</div>
      </div>
    </div>
  `;
}
function getEventColorClass(ev) {
    if (ev.kind === 'sleep')
        return 'ev-sleep';
    if (ev.kind === 'wind_down')
        return 'ev-wind-down';
    if (ev.kind === 'routine')
        return 'ev-routine';
    if (ev.kind === 'travel')
        return 'ev-travel';
    if (ev.deferredReason)
        return 'ev-conflict';
    if (ev.kind === 'fixed')
        return 'ev-fixed';
    if (ev.priority === 'required')
        return 'ev-required';
    if (ev.priority === 'important')
        return 'ev-important';
    return 'ev-optional';
}
function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function msToInputValue(ms) {
    const d = new Date(ms);
    const Y = d.getFullYear();
    const M = String(d.getMonth() + 1).padStart(2, '0');
    const D = String(d.getDate()).padStart(2, '0');
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${Y}-${M}-${D}T${h}:${m}`;
}
function inputToMs(value) {
    const [datePart, timePart] = value.split('T');
    if (!datePart || !timePart)
        return Date.now();
    const [year, month, day] = datePart.split('-').map(Number);
    const [hour, minute] = timePart.split(':').map(Number);
    return localMs(year, month, day, hour, minute);
}

function parseMeetingForm() {
    const titleEl = document.getElementById('meeting-title');
    const startEl = document.getElementById('meeting-start');
    const endEl = document.getElementById('meeting-end');
    const errorEl = document.getElementById('meeting-form-error');
    if (!titleEl || !startEl || !endEl)
        return null;
    const title = titleEl.value.trim();
    const start = inputToMs(startEl.value);
    const end = inputToMs(endEl.value);
    errorEl.style.display = 'none';
    if (!title) {
        errorEl.textContent = 'Please enter a meeting title.';
        errorEl.style.display = 'block';
        titleEl.focus();
        return null;
    }
    if (end <= start) {
        errorEl.textContent = 'End time must be after start time.';
        errorEl.style.display = 'block';
        endEl.focus();
        return null;
    }
    return {
        id: newId('meeting'),
        title,
        start,
        end,
        kind: 'fixed',
        category: 'work',
        priority: 'required',
    };
}

function parseProtectForm() {
    const get = (id) => document.getElementById(id);
    const title = get('ev-title')?.value?.trim();
    const startVal = get('ev-start')?.value;
    const dur = Number(get('ev-dur')?.value);
    const travel = Number(get('ev-travel')?.value);
    const routine = Number(get('ev-routine')?.value);
    const tib = Number(get('ev-tib')?.value);
    const windDown = Number(get('ev-winddown')?.value);
    const prep = Number(get('ev-prep')?.value);
    const prepDeadlineVal = get('ev-prep-deadline')?.value;
    const earliestBedVal = get('ev-earliest-bed')?.value;
    const earliestWakeVal = get('ev-earliest-wake')?.value;
    const latestWakeVal = get('ev-latest-wake')?.value;
    if (!title || !startVal || !validateProtectForm(false))
        return null;
    const parseLocal = (val) => {
        const [datePart, timePart] = val.split('T');
        if (!datePart || !timePart)
            return 0;
        const [y, m, d] = datePart.split('-').map(Number);
        const [h, min] = timePart.split(':').map(Number);
        return localMs(y, m, d, h, min);
    };
    const start = parseLocal(startVal);
    const prepDeadline = prepDeadlineVal ? parseLocal(prepDeadlineVal) : start - 60 * 60000 * 9;
    const earliestBed = earliestBedVal ? parseLocal(earliestBedVal) : start - tib * 60000 - 2 * 3600000;
    const earliestWake = earliestWakeVal ? parseLocal(earliestWakeVal) : start - (travel + routine) * 60000 - 60 * 60000;
    const latestWake = latestWakeVal ? parseLocal(latestWakeVal) : start - (travel + routine) * 60000;
    return {
        title,
        start,
        durationMinutes: dur,
        travelBufferMinutes: travel,
        morningRoutineMinutes: routine,
        desiredTimeInBedMinutes: tib,
        windDownMinutes: windDown,
        preparationMinutes: prep,
        preparationDeadline: prepDeadline,
        earliestBedtime: earliestBed,
        earliestWakeTime: earliestWake,
        latestWakeTime: latestWake,
    };
}

        preparationScheduledMinutes: plan.preparationScheduledMinutes,
        preparationRequiredMinutes: plan.preparationRequiredMinutes,

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });

function commandTime(value){
 let text=value.toLowerCase().trim().replace(/\./g,'').replace(/\s+/g,' ');
 if(text==='noon')return '12:00';if(text==='midnight')return '00:00';
 const words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
 text=text.replace(/^(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)(?: (fifteen|thirty|forty five|forty-five))? (am|pm)$/,(_,h,m,p)=>words[h]+(m?':'+({fifteen:'15',thirty:'30','forty five':'45','forty-five':'45'}[m]):'')+' '+p);
 const m=text.match(/^(\d{1,2})(?::([0-5]\d))?\s*(am|pm)?$/);if(!m)return null;
 let hour=Number(m[1]),minute=Number(m[2]||0);
 if(m[3]){if(hour<1||hour>12)return null;hour=hour%12+(m[3]==='pm'?12:0);}else if(hour>23||(!m[2]&&hour<13))return null;

}
function commandDuration(value){

 const minutes=Number(m[1])*(/^h/.test(m[2])?60:1);return Number.isSafeInteger(minutes)&&minutes>=1&&minutes<=480?minutes:null;
}

 document.body.appendChild(modal);
 const field=modal.querySelector('#voice-request'),status=modal.querySelector('#voice-status'),confirm=modal.querySelector('#voice-confirm'),review=modal.querySelector('#voice-preview'),listen=modal.querySelector('#voice-listen');
 const stop=()=>{clearTimeout(timer);if(recognizer){recognizer.onstart=null;recognizer.onresult=null;recognizer.onend=null;recognizer.onerror=null;recognizer.abort();recognizer=null;}listen.textContent='Speak a change';listen.setAttribute('aria-pressed','false');};
 const close=()=>{closed=true;stop();document.removeEventListener('keydown',onKey);window.removeEventListener('pagehide',close);modal.remove();document.getElementById('btn-voice-schedule')?.focus();};
 const onKey=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...modal.querySelectorAll('button:not(:disabled),textarea')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items[items.length-1].focus();}else if(!e.shiftKey&&document.activeElement===items[items.length-1]){e.preventDefault();items[0].focus();}}};
 document.addEventListener('keydown',onKey);window.addEventListener('pagehide',close,{once:true});
 modal.querySelector('.modal-close').addEventListener('click',close);modal.querySelector('#voice-cancel').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close();});
 const invalidate=()=>{preview=null;confirm.disabled=true;review.replaceChildren();};
 field.addEventListener('input',()=>{invalidate();status.textContent='';});
 listen.addEventListener('click',()=>{
  if(recognizer){stop();status.textContent='Stopped. You can edit your request below.';return;}if(!Speech)return;
  invalidate();lastError=false;transcriptReceived=false;
  try{const recognition=new Speech();recognizer=recognition;recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
   recognition.onstart=()=>{if(closed)return;listen.textContent='Stop listening';listen.setAttribute('aria-pressed','true');status.textContent='Listening… Say one change, including AM or PM.';};
   recognition.onresult=event=>{if(closed)return;field.value=String(event.results?.[0]?.[0]?.transcript||'').slice(0,400);transcriptReceived=!!field.value;invalidate();status.textContent=transcriptReceived?'Check the words, then choose Review change.':'I didn’t catch that. Try again or type your request.';};
   recognition.onerror=event=>{if(closed)return;lastError=true;status.textContent=['not-allowed','service-not-allowed'].includes(event.error)?'Microphone access wasn’t allowed. You can type your request instead.':'Voice input didn’t finish. Try again or type your request.';};
   recognition.onend=()=>{recognizer=null;clearTimeout(timer);if(closed)return;listen.textContent='Speak a change';listen.setAttribute('aria-pressed','false');if(!lastError&&!transcriptReceived)status.textContent='I didn’t catch that. Try again or type your request.';};
   recognition.start();timer=setTimeout(()=>{if(recognizer){stop();status.textContent='Listening stopped. You can try again or type your request.';}},30000);
  }catch{stop();status.textContent='Voice input isn’t available here. Type your request below.';}
 });
 modal.querySelector('#voice-review').addEventListener('click',()=>{stop();invalidate();const result=previewScheduleCommand(field.value);if(!result.ok){status.textContent=result.message;return;}preview=result;status.textContent='Nothing has changed yet.';review.innerHTML=`<div class="voice-review-card"><strong>${escHtml(result.summary)}</strong><p>${escHtml(result.note)}</p></div>`;confirm.disabled=false;});
 confirm.addEventListener('click',()=>{if(!preview)return;const result=applyScheduleCommand(field.value,preview.fingerprint);if(!result.ok){invalidate();status.textContent=result.message;return;}close();showSwapFeedback(result);});
 field.focus();
}

let whoopConnection={loaded:false,configured:false,connected:false,busy:false,message:''};
function isWhoopReading(state=getState()){return state.wearableContext.source==='whoop';}
function renderWhoopConnection(state){
 const connection=whoopConnection,real=isWhoopReading(state);
 return `<div class="demo-connection"><button class="btn-secondary" id="connect-whoop-demo">${Icons.activity(14)} ${!real&&state.wearableContext.demoSyncedAt?'✓ Demo synced · Sync again':'Connect your WHOOP'}</button><span>Demo connection — simulates syncing from WHOOP.</span><div id="demo-sync-status" role="status" aria-live="polite">${!real&&state.wearableContext.demoSyncedAt?`<div class="sync-success-card"><strong>✓ Demo readings ready</strong><div class="sync-success-values"><span><b>${state.wearableContext.recoveryPercent}%</b> Recovery</span><span><b>${formatSleep(state.wearableContext.sleepMinutes)}</b> Sleep</span></div><small>Simulated WHOOP sync · ${escHtml(new Date(state.wearableContext.demoSyncedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}</small></div>`:''}${state.demoSyncNotice?`<p>${escHtml(state.demoSyncNotice)}</p>`:''}</div></div>${renderMockHealthSources(state)}<details class="whoop-connection" ${connection.message||state.whoopNotice?'open':''}><summary>${Icons.activity(13)} ${real?'Your WHOOP readings':connection.connected?'WHOOP connected':'Real WHOOP syncing'}</summary><div class="whoop-connection-body"><p>${real?'Your recovery and latest sleep are shown with this sample calendar.':connection.connected?'Connected. Import your latest readings to try them with this sample calendar.':'You can explore the whole demo without connecting an account.'}</p>${real?`<p>Sleep ended ${escHtml(new Date(state.wearableContext.sleepEndedAt).toLocaleString())}. Imported ${escHtml(new Date(state.wearableContext.importedAt).toLocaleTimeString())}.</p>`:''}${connection.loaded?(connection.configured?(connection.connected?`<div class="whoop-actions"><button class="btn-secondary" id="whoop-import" ${connection.busy?'disabled':''}>${connection.busy?'Please wait…':'Use my latest readings'}</button><button class="btn-secondary" id="whoop-disconnect" ${connection.busy?'disabled':''}>Disconnect</button></div>`:`<button class="btn-secondary" id="whoop-connect">Connect real WHOOP</button><p>Sign in on WHOOP and allow recovery and sleep access. Connections last up to one hour.</p>`):'<p>Using demo readings. WHOOP connection is not enabled on this deployment.</p>'):'<p>Checking connection…</p>'}${real?'<button class="btn-secondary" id="whoop-demo">Use demo readings</button>':''}<p class="whoop-message" role="status">${escHtml(state.whoopNotice||connection.message||'')}</p><small>Real imported readings stay in this page’s memory and clear on reload. Only recovery and sleep are requested. Calendar changes always need your approval.</small></div></details>`;
}
async function whoopRequest(action,method='GET'){
 const response=await fetch('/.netlify/functions/whoop/'+action,{method,credentials:'same-origin',cache:'no-store',headers:method==='POST'?{'Content-Type':'application/json'}:{},...(method==='POST'?{body:'{}'}:{})});
 let data;try{data=await response.json();}catch{throw new Error('WHOOP connection is not enabled on this deployment. Demo readings still work.');}
 if(!response.ok){const error=new Error(data.message||'WHOOP is unavailable. Try again.');error.status=response.status;throw error;}return data;
}
async function initializeWhoopConnection(){
 try{const data=await whoopRequest('status');whoopConnection={...whoopConnection,loaded:true,configured:data.configured===true,connected:data.connected===true};}
 catch{whoopConnection={...whoopConnection,loaded:true,configured:false,connected:false};}
 const url=new URL(window.location.href),result=url.searchParams.get('whoop');
 if(result){const messages={connected:'WHOOP connected. Choose “Use my latest readings” to import them.',denied:'Connection cancelled. You can keep using the demo.',invalid_state:'The connection link expired. Please connect again.',failed:'WHOOP could not connect. Please try again.'};whoopConnection.message=messages[result]||'';url.searchParams.delete('whoop');window.history.replaceState(null,'',url.pathname+url.search+url.hash);}
 notify();
}
function applyWhoopReadings(readings){
 const ended=Date.parse(readings?.sleepEndedAt),imported=Date.parse(readings?.importedAt);
 if(readings?.source!=='whoop'||!Number.isFinite(readings.recoveryPercent)||readings.recoveryPercent<0||readings.recoveryPercent>100||!Number.isInteger(readings.sleepMinutes)||readings.sleepMinutes<=0||readings.sleepMinutes>1440||!Number.isFinite(ended)||!Number.isFinite(imported)||Date.now()-ended>36*3600000||ended>Date.now()+300000)throw new Error('WHOOP readings are incomplete or too old. Sync WHOOP and try again.');
 setState({wearableContext:{source:'whoop',recoveryPercent:readings.recoveryPercent,sleepMinutes:readings.sleepMinutes,sleepEndedAt:readings.sleepEndedAt,importedAt:readings.importedAt,date:readings.date},demoSyncNotice:null,whoopNotice:'Readings imported. Your sample calendar has not changed.'});
}
async function importWhoopReadings(){
 if(whoopConnection.busy)return;whoopConnection.busy=true;setState({whoopNotice:''});
 try{const data=await whoopRequest('readings','POST');applyWhoopReadings(data.readings);}
 catch(error){if(error.status===401){whoopConnection.connected=false;setState({wearableContext:copyDemo(PERSONAS[getState().personaId].readings)});}setState({whoopNotice:error.message});}
 finally{whoopConnection.busy=false;notify();}
}
async function disconnectWhoop(){
 if(whoopConnection.busy)return;whoopConnection.busy=true;setState({whoopNotice:''});
 try{await whoopRequest('disconnect','POST');whoopConnection.connected=false;setState({wearableContext:copyDemo(PERSONAS[getState().personaId].readings),whoopNotice:'WHOOP disconnected. Your readings were cleared from this page.'});}
 catch(error){if(error.status===401){whoopConnection.connected=false;setState({wearableContext:copyDemo(PERSONAS[getState().personaId].readings)});}setState({whoopNotice:error.message});}
 finally{whoopConnection.busy=false;notify();}
}

// ─── Bootstrap ────────────────────────────────────────────────────────────────
subscribe(render);
render(); // Initial render
if(typeof window!=='undefined'&&typeof fetch==='function')initializeWhoopConnection();

  </script>
</body>
